gates:
  plan_approval: machine_then_human  # the machine critic reviews the plan, then you approve it
  implementation_approval: human     # the run parks until you review the PR on GitHub (webhook via the tunnel)
on_approval: merge                   # when you Approve the PR on GitHub, Druks merges it; the ticket goes to Done
delete_branch: true
verification:                        # DRU-771 E2E re-check at 2bff0db
  test_commands: ["pytest -q --maxfail=1"]
